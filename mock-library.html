<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoard — library view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#16112A; --surface:#1F1838; --raised:#2C2350; --line:#3D3168;
    --text:#F0ECFF; --dim:#9B90C4;
    --flare:#FF5C8A; --volt:#4DE8C2; --amber:#FFB63D; --azure:#5B9DFF;
    --tile:148px; --rail:220px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--text);
       font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
        font-variation-settings:'wdth' 105}
  .disp-s{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
          font-variation-settings:'wdth' 110;letter-spacing:.06em;text-transform:uppercase}
  .data{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}
  .data-s{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
          font-size:10px;color:var(--dim)}

  .app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}

  /* ── rail ───────────────────────────────────────────── */
  .rail{background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
  .rail-head{padding:0 16px 18px;display:flex;align-items:baseline;gap:8px}
  .rail-head .n{font-family:'IBM Plex Mono',monospace;font-size:22px;
                font-variant-numeric:tabular-nums}
  .rail-head .l{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

  .bucket{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;
          border-left:2px solid transparent;cursor:pointer;transition:background .12s}
  .bucket:hover{background:var(--raised)}
  .bucket.on{background:var(--raised);border-left-color:var(--volt)}
  .bucket .nm{flex:1}
  .bucket .c{font-family:'IBM Plex Mono',monospace;font-size:11px;
             font-variant-numeric:tabular-nums;color:var(--dim)}
  .bucket .pip{width:7px;height:7px;border-radius:50%;background:var(--flare);
               box-shadow:0 0 8px rgba(255,92,138,.7);flex:none}

  .sep{margin:22px 16px 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
  .li{height:30px;padding:0 16px;display:flex;align-items:center;color:var(--dim);cursor:pointer}
  .li:hover{background:var(--raised);color:var(--text)}

  /* ── command bar ────────────────────────────────────── */
  .main{display:flex;flex-direction:column;overflow:hidden}
  .cmd{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;
       gap:10px;padding:0 20px;flex:none}
  .search{flex:1;max-width:380px;background:var(--surface);border:1px solid var(--line);
          border-radius:4px;height:30px;padding:0 10px;color:var(--text);
          font-family:inherit;font-size:13px}
  .search::placeholder{color:var(--dim)}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);
       border-radius:4px;overflow:hidden}
  .seg div{padding:5px 10px;cursor:pointer;color:var(--dim);font-size:13px}
  .seg div.on{background:var(--raised);color:var(--volt)}
  .ctl{color:var(--dim);font-size:12px;cursor:pointer;padding:5px 9px;border-radius:4px}
  .ctl:hover{background:var(--raised);color:var(--text)}
  .spacer{flex:1}

  /* ── grid ───────────────────────────────────────────── */
  .grid{flex:1;overflow-y:auto;padding:20px;display:grid;
        grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:16px;align-content:start}

  .tile{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
        cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;
        border:1px solid rgba(61,49,104,.6)}
  .tile:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.55);z-index:2}
  .tile.sel{outline:2px solid var(--volt);outline-offset:1px}

  /* cover art stand-in — procedural. real builds pull IGDB / 600x900 capsules. */
  .art{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;
       transition:filter .14s ease}
  .tile:hover .art{filter:none !important}
  .art .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
           font-variation-settings:'wdth' 88;font-size:19px;line-height:1.05;
           color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.65)}
  .art::after{content:'';position:absolute;inset:0;
              background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 42%)}

  .badge{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;
         background:var(--flare);border:2px solid var(--ground);
         box-shadow:0 0 10px rgba(255,92,138,.85);z-index:3}

  .scrim{position:absolute;left:0;right:0;bottom:0;padding:10px;
         background:linear-gradient(to top,rgba(22,17,42,.94) 30%,rgba(22,17,42,0));
         opacity:0;transition:opacity .14s ease;z-index:2}
  .tile:hover .scrim{opacity:1}
  .scrim .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .scrim .store{font-size:9px;color:var(--dim);border:1px solid var(--line);
                border-radius:3px;padding:1px 5px;letter-spacing:.06em}
  .play{display:block;text-align:center;background:var(--volt);color:#0C2A24;
        font-weight:700;font-size:12px;padding:6px;border-radius:4px}

  .stat{font-family:'IBM Plex Mono',monospace;font-size:10px;
        font-variant-numeric:tabular-nums;color:var(--dim)}

  /* ── journal prompt ─────────────────────────────────── */
  .prompt{position:fixed;right:24px;bottom:24px;width:400px;background:var(--raised);
          border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;gap:14px;
          box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:20}
  .prompt .cov{width:60px;height:90px;border-radius:4px;flex:none;
               background:linear-gradient(150deg,#2E7D5B,#8FBF3F)}
  .prompt .body{flex:1}
  .prompt .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px}
  .prompt .m{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);
             margin:2px 0 10px}
  .prompt textarea{width:100%;height:48px;background:var(--surface);resize:none;
                   border:1px solid var(--line);border-radius:4px;padding:7px;
                   color:var(--text);font-family:inherit;font-size:12px}
  .prompt textarea::placeholder{color:var(--dim)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .dots{display:flex;gap:5px}
  .dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);cursor:pointer}
  .dot.on{background:var(--volt);border-color:var(--volt)}
  .skip{font-size:11px;color:var(--dim);cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="rail-head"><span class="n">1,247</span><span class="l">titles</span></div>
    <div class="bucket on"><span class="pip"></span><span class="nm disp-s">Patched since</span><span class="c">94</span></div>
    <div class="bucket"><span class="nm disp-s">Never opened</span><span class="c">412</span></div>
    <div class="bucket"><span class="nm disp-s">Bounced off</span><span class="c">186</span></div>
    <div class="bucket"><span class="nm disp-s">Played out</span><span class="c">391</span></div>
    <div class="bucket"><span class="nm disp-s">Won't run</span><span class="c">164</span></div>
    <div class="sep">Lists</div>
    <div class="li">Co-op night</div>
    <div class="li">Under 6 hours</div>
    <div class="li">Deck verified</div>
  </aside>

  <main class="main">
    <div class="cmd">
      <input class="search" placeholder="Search 1,247 titles…">
      <div class="seg"><div class="on">▦</div><div>▤</div></div>
      <span class="ctl">Dormant longest ▾</span>
      <span class="ctl">All stores ▾</span>
      <span class="spacer"></span>
      <span class="ctl">Density ──○──</span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="prompt">
  <div class="cov"></div>
  <div class="body">
    <div class="t">Vintage Story</div>
    <div class="m">1h 47m · ended 12:04 AM</div>
    <textarea placeholder="What were you doing? (helps when you come back)"></textarea>
    <div class="foot">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
      <span class="skip">How was that?</span>
    </div>
  </div>
</div>

<script>
/* Dormancy ramp — the art IS the chart.
   Saturation and brightness fall off with months idle, clamped at .22/.60:
   a cover you can't identify is a cover you can't choose. */
const SAT_FLOOR = .22, BRIGHT_FLOOR = .60, FULL_MONTHS = 36;

function dim(months){
  const t = Math.min(1, months / FULL_MONTHS);
  const sat    = 1 - (1 - SAT_FLOOR) * t;
  const bright = 1 - (1 - BRIGHT_FLOOR) * t;
  // slight cool shift reinforces the fade without touching the palette
  const hue = -6 * t;
  return `saturate(${sat.toFixed(2)}) brightness(${bright.toFixed(2)}) hue-rotate(${hue.toFixed(0)}deg)`;
}

/* Procedural cover stand-ins. Real builds pull IGDB covers and Steam's
   library_600x900 portrait capsule — never reproduce publisher art in mocks. */
const games = [
  {n:'RimWorld',             s:'STEAM', h:'312h', idle:8,  ago:'8mo',   u:3, g:['#C2410C','#7C2D12']},
  {n:'Vintage Story',        s:'GOG',   h:'41h',  idle:11, ago:'11mo',  u:3, g:['#2E7D5B','#8FBF3F'], sel:1},
  {n:'Factorio',             s:'STEAM', h:'190h', idle:16, ago:'1y 4mo',u:2, g:['#D97706','#78350F']},
  {n:'Oxygen Not Included',  s:'STEAM', h:'52h',  idle:14, ago:'1y 2mo',u:3, g:['#0E7490','#164E63']},
  {n:'Deep Rock Galactic',   s:'STEAM', h:'127h', idle:19, ago:'1y 7mo',u:2, g:['#B45309','#451A03']},
  {n:'Valheim',              s:'STEAM', h:'96h',  idle:21, ago:'1y 9mo',u:2, g:['#365314','#1A2E05']},
  {n:'Dyson Sphere Program', s:'STEAM', h:'37h',  idle:24, ago:'2y',    u:2, g:['#1E3A8A','#4C1D95']},
  {n:'Project Zomboid',      s:'STEAM', h:'88h',  idle:25, ago:'2y 1mo',u:2, g:['#7F1D1D','#292524']},
  {n:'Satisfactory',         s:'EPIC',  h:'64h',  idle:29, ago:'2y 5mo',u:2, g:['#EA580C','#9A3412']},
  {n:'Terraria',             s:'STEAM', h:'204h', idle:32, ago:'2y 8mo',u:2, g:['#0891B2','#155E75']},
  {n:'Kenshi',               s:'GOG',   h:'23h',  idle:38, ago:'3y 2mo',u:1, g:['#78716C','#44403C']},
  {n:'Grim Dawn',            s:'GOG',   h:'71h',  idle:42, ago:'3y 6mo',u:1, g:['#5B21B6','#1E1B4B']},
  {n:'Subnautica',           s:'STEAM', h:'44h',  idle:30, ago:'2y 6mo',u:1, g:['#0369A1','#0C4A6E']},
  {n:'Stardew Valley',       s:'GOG',   h:'156h', idle:18, ago:'1y 6mo',u:2, g:['#65A30D','#3F6212']},
  {n:'Slay the Spire',       s:'STEAM', h:'89h',  idle:27, ago:'2y 3mo',u:1, g:['#BE123C','#4C0519']},
  {n:'Noita',                s:'STEAM', h:'31h',  idle:35, ago:'2y 11mo',u:1,g:['#A16207','#1C1917']},
  {n:'Hollow Knight',        s:'STEAM', h:'62h',  idle:40, ago:'3y 4mo',u:1, g:['#1E293B','#020617']},
  {n:'Outer Wilds',          s:'EPIC',  h:'22h',  idle:26, ago:'2y 2mo',u:1, g:['#7C3AED','#312E81']},
];

document.getElementById('grid').innerHTML = games.map(g=>`
  <div class="tile${g.sel?' sel':''}">
    ${g.u?'<div class="badge" title="'+g.u+' updates since you played"></div>':''}
    <div class="art" style="background:linear-gradient(155deg,${g.g[0]},${g.g[1]});filter:${dim(g.idle)}">
      <div class="nm">${g.n}</div>
    </div>
    <div class="scrim">
      <div class="row">
        <span class="stat">${g.h} · idle ${g.ago}</span>
        <span class="store">${g.s}</span>
      </div>
      <span class="play">Play</span>
    </div>
  </div>`).join('');
</script>
</body>
</html>
