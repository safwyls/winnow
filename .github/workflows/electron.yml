name: Electron frontend

on:
  pull_request:
    paths:
      - 'src/Winnow.Electron/**'
      - '.github/workflows/electron.yml'
  push:
    branches: [main]
    paths:
      - 'src/Winnow.Electron/**'
      - '.github/workflows/electron.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Winnow.Electron
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Winnow.Electron/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
